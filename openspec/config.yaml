schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: TaskFlow, a local-first Google Chrome extension.
  Stack: Manifest V3, WXT, Vue 3, Pinia, TypeScript strict, Vitest, ESLint, Prettier, npm.
  Architecture: keep UI, application/domain, persistence, and Chrome API adapters separated without enterprise layering.
  Current phase: technical foundation plus MVP specification. Do not implement the MVP before explicit approval and apply.
  Persistence target for the MVP: chrome.storage.local behind a TaskRepository abstraction.
  Reminders must use persisted data, chrome.alarms, and chrome.notifications; never depend on in-memory timers.
  Permissions must be minimal and justified. Do not add host permissions for future features.
  Product boundary: TaskFlow must remain self-contained and local-first. Never introduce a TaskFlow-owned or mandatory backend, central authentication, or required cloud service.
  Optional external integrations must run directly from the extension through adapters, use user-controlled endpoints, permissions, and credentials, and never be required for core task management.
  Future AI must be opt-in and BYOK, with user-configured OpenAI-compatible or Anthropic providers; credentials must remain local and never be logged or exported.

rules:
  proposal:
    - Include explicit non-goals and identify features deferred to future Changes.
    - Keep the proposal focused on user-visible capability and scope.
  specs:
    - Use testable Given/When/Then scenarios for each externally observable behavior.
    - Cover validation, overdue semantics, persistence, and reminder edge cases.
  design:
    - Record alternatives and rationale for storage, state, cross-context communication, and Manifest V3 reminders.
    - Avoid speculative abstractions beyond the approved MVP.
  tasks:
    - Order tasks by dependency and include tests with each behavior rather than as a final catch-all.
    - Include explicit validation of manifest permissions and the production build.
operations:
  apply:
    guidance:
      - Work on the feature branch and keep each implementation task within the approved Change.
      - Create coherent checkpoint commits after validated task groups so work is recoverable.
  archive:
    guidance:
      - Archive only after implementation, verification, PR review, and human approval.
      - Run archive on the same feature branch, commit the archived artifacts and consolidated specs, rerun CI, and merge only after the final gate passes.
      - Never archive by committing directly to main.
githubCopilot:
  cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

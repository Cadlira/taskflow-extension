name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check Manifest icons
        run: |
          node --input-type=module -e "
          import { existsSync, readFileSync } from 'node:fs';
          const dir = '.output/chrome-mv3';
          const manifest = JSON.parse(readFileSync(dir + '/manifest.json', 'utf8'));
          for (const size of ['16', '32', '48', '128']) {
            const icon = manifest.icons?.[size];
            if (!icon) throw new Error('Manifest sem icons.' + size);
            if (!existsSync(dir + '/' + icon)) throw new Error('Ícone ausente no pacote: ' + icon);
          }
          "
